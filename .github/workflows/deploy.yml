name: Deploy to KVM (Dev)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run backend tests
        working-directory: backend
        run: |
          go mod download
          go test ./... -v -race -count=1

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          connect_timeout: 30s
          command_timeout: 15m
          script: |
            set -e
            export PATH=$PATH:/usr/local/go/bin
            DEPLOY_DIR="/opt/aprova-cards"
            cd "$DEPLOY_DIR"

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            [ -f .env ] || { echo "❌ .env não encontrado!"; exit 1; }
            ln -sf "$DEPLOY_DIR/.env" "$DEPLOY_DIR/backend/.env"

            echo "📦 Installing frontend dependencies..."
            cd "$DEPLOY_DIR/frontend"
            npm ci --ignore-scripts 2>/dev/null || npm install

            echo "🔨 Building frontend..."
            VITE_BACKEND_URL="https://api.aprovacards.com.br" \
            VITE_API_BASE_URL="https://api.aprovacards.com.br/api/v1" \
            npm run build

            echo "🔨 Building backend..."
            cd "$DEPLOY_DIR/backend"
            go mod download
            CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/aprova-cards ./cmd/server/main.go

            echo "🔄 Reiniciando serviços..."
            pkill -f "aprova-cards" 2>/dev/null || true
            pkill -f "npx serve" 2>/dev/null || true
            sleep 2

            setsid nohup "$DEPLOY_DIR/backend/bin/aprova-cards" \
              > /tmp/aprova-backend.log 2>&1 </dev/null &
            disown $!
            echo $! > /tmp/aprova-backend.pid

            setsid nohup npx serve -s "$DEPLOY_DIR/frontend/dist" -l 5173 \
              > /tmp/aprova-frontend.log 2>&1 </dev/null &
            disown $!
            echo $! > /tmp/aprova-frontend.pid

            echo "✅ Deploy concluído!"
